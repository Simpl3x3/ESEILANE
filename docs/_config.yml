title: ESEILANE Docs
description: High-performance Knowledge Graph engine for AI, LLMs, and GraphRAG
url: https://simpl3x3.github.io
baseurl: /ESEILANE
logo: /assets/images/logo.svg

remote_theme: just-the-docs/just-the-docs

# Theme settings
color_scheme: dark
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

aux_links:
  "GitHub":
    - "https://github.com/Simpl3x3/ESEILANE"
  "eseilane.org":
    - "https://eseilane.org"

aux_links_new_tab: true

nav_sort: case_insensitive

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

footer_content: "Copyright &copy; 2026 <a href='https://github.com/Simpl3x3'>Simpl3x3</a>. All rights reserved. Distributed under the <a href='https://github.com/Simpl3x3/ESEILANE/blob/main/LICENSE'>Apache 2.0 License</a>."
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

back_to_top: true
back_to_top_text: "Back to top"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - .DS_Store
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
